name: Deploy PRODUCTION (build + deploy)

# Dispara em todo merge (push) na main = deploy automatico na VPS.
# 1. docker:      builda e publica a imagem (target production)
# 2. validate:    security & performance gate na mesma imagem
# 3. deploy-vps:  sincroniza .devcontainer/production/ e roda deploy.sh na EC2:
#                 docker pull, checkout do codigo em /home/admin/moodle/code,
#                 `docker compose up -d --wait` (recria so se a imagem mudou;
#                 senao restart se .php mudou) + purge_caches.
#                 upgrade.php NUNCA roda aqui: Administracao do site > Notificacoes.
#
# Detalhes e operacao: .devcontainer/docs/PRODUCTION.md

env:
  IMAGE_TAG: 4.5.15-php8.3

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  docker:
    name: Build and push production image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Lint AMD builds (named define, no ES modules)
        run: python3 .github/scripts/amd_lint.py

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (target production)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/build/moodle.Dockerfile
          target: production
          push: true
          pull: true
          tags: |
            leodg/moodle-academy:${{ env.IMAGE_TAG }}
            leodg/moodle-academy:${{ env.IMAGE_TAG }}-${{ github.sha }}
          build-args: |
            MOODLE_URL=${{ vars.MOODLE_URL }}
            ENVIRONMENT=production

  validate-production:
    name: Validate PRODUCTION (security & performance gate)
    needs: docker
    uses: ./.github/workflows/validation-production.yml
    with:
      image_ref: leodg/moodle-academy:4.5.15-php8.3
    secrets: inherit

  deploy-vps:
    name: Deploy on AWS EC2 (docker compose)
    needs: [docker, validate-production]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # Scripts + compose.yml ficam fora do diretorio de codigo: o deploy.sh faz
      # checkout em /home/admin/moodle/code e nao pode rodar de dentro dele.
      - name: Sync production scripts
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlzvc --delete --mkpath"
          SOURCE: ".devcontainer/production/"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: /home/admin/devcontainer/production/

      - name: Run deploy.sh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e
            chmod +x /home/admin/devcontainer/production/*.sh
            /home/admin/devcontainer/production/deploy.sh "${{ github.ref_name }}" "${{ env.IMAGE_TAG }}"
