name: Deploy DEVELOP Sandbox to GCP

on:
  push:
    branches:
      - integration/infra-devcontainer-gcp
  workflow_dispatch:

jobs:
  start-sandbox:
    name: start-sandbox
    runs-on: ubuntu-latest
    environment: development
    outputs:
      vm_ip: ${{ steps.get_ip.outputs.ip }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Start VM
        run: |
          STATUS=$(gcloud compute instances describe ${{ secrets.GCP_VM_NAME }} \
            --zone=${{ secrets.GCP_ZONE }} \
            --format='get(status)')
          if [ "$STATUS" != "RUNNING" ]; then
            echo "🚀 VM is $STATUS. Turning on..."
            gcloud compute instances start ${{ secrets.GCP_VM_NAME }} \
              --zone=${{ secrets.GCP_ZONE }} || echo " ❌ Resource exhausted in GCP."
            sleep 20
          else
            echo "✅ VM is already RUNNING."
          fi

      - name: Get IP
        id: get_ip
        run: |
          VM_IP=$(gcloud compute instances describe ${{ secrets.GCP_VM_NAME }} \
            --zone=${{ secrets.GCP_ZONE }} \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "ip=$VM_IP" >> $GITHUB_OUTPUT
          echo "🌐 VM IP: $VM_IP"

  docker:
    name: Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (target development)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/build/moodle.Dockerfile
          target: development
          push: true
          tags: |
            leodg/moodle-academy:develop
            leodg/moodle-academy:${{ github.sha }}

  integration:
    name: Integration checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check PHP syntax in custom files
        run: |
          echo "=== Checking PHP syntax in custom files ==="
          find .devcontainer/config -name "*.php" -exec php -l {} \; 2>&1
          echo "=== Checking entrypoint is executable ==="
          [ -f ".devcontainer/bin/moodle-entrypoint" ] && echo "OK: moodle-entrypoint found" || echo "WARN: moodle-entrypoint not found"
          echo "=== Checking .dockerignore exists ==="
          [ -f ".dockerignore" ] && echo "OK: .dockerignore found" || echo "WARN: .dockerignore missing"
          echo "=== Integration checks passed ==="

  deploy-sandbox:
    name: Deploy to GCP VM
    needs: [start-sandbox, docker, integration]
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Diagnostico de IP
        run: |
          echo "IP da VM GCP: ${{ needs.start-sandbox.outputs.vm_ip }}"
          if [ -z "${{ needs.start-sandbox.outputs.vm_ip }}" ]; then
            echo "ERRO: IP vazio!"
            exit 1
          fi

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Sync compose files to GCP VM
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --exclude=secrets/ --exclude=certs/"
          SOURCE: ".devcontainer/compose/"
          REMOTE_HOST: ${{ needs.start-sandbox.outputs.vm_ip }}
          REMOTE_USER: leonardodg
          TARGET: /home/leonardodg/academy-compose/

      - name: Deploy via docker compose (MariaDB + Moodle) na VM GCP
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ needs.start-sandbox.outputs.vm_ip }}
          username: leonardodg
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e

            mkdir -p /home/leonardodg/moodledata
            sudo chown -R 33:33 /home/leonardodg/moodledata

            export IMAGE_TAG="develop"
            export MOODLE_DBNAME="${{ secrets.MOODLE_DBNAME }}"
            export MOODLE_DBUSER="${{ secrets.MOODLE_DBUSER }}"
            export MOODLE_DBPASS="${{ secrets.MOODLE_DBPASS }}"
            export MOODLE_DBROOT="${{ secrets.MOODLE_DBROOT }}"

            cd /home/leonardodg/ivana-academy

            docker compose \
              -f /home/leonardodg/academy-compose/base.yml \
              -f /home/leonardodg/academy-compose/db.yml \
              -f compose/sandbox.yml \
              pull

            docker compose \
              -f /home/leonardodg/academy-compose/base.yml \
              -f /home/leonardodg/academy-compose/db.yml \
              -f /home/leonardodg/academy-compose/sandbox.yml \
              up -d

            echo "=== Status dos containers ==="
            docker compose \
              -f compose/base.yml \
              -f /home/leonardodg/academy-compose/db.yml \
              -f /home/leonardodg/academy-compose/sandbox.yml \
              ps

  auto-shutdown:
    name: Auto-shutdown GCP VM
    runs-on: ubuntu-latest
    needs: deploy-sandbox
    if: always()
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Stop GCP VM
        run: |
          gcloud compute instances stop ${{ secrets.GCP_VM_NAME }} \
            --zone=${{ secrets.GCP_ZONE }}
          echo "🛑 VM STOPPED."