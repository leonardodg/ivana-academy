name: Build PRODUCTION v2 image

# Builda, valida (security & performance gate) e publica a imagem v2.
# NAO acessa a VPS: todos os passos na producao sao manuais, seguindo
# .devcontainer/docs/UPGRADE-PHP83-MOODLE-4515-MANUAL.md

env:
  IMAGE_TAG: 4.5.15-php8.3

on:
  push:
    branches:
      - release/production-v2
  workflow_dispatch:

jobs:
  docker:
    name: Build and push production image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (target production)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/build/moodle.Dockerfile
          target: production
          push: true
          pull: true
          tags: |
            leodg/moodle-academy:${{ env.IMAGE_TAG }}
            leodg/moodle-academy:${{ env.IMAGE_TAG }}-${{ github.sha }}
          build-args: |
            MOODLE_URL=${{ vars.MOODLE_URL }}
            ENVIRONMENT=production

  validate-production:
    name: Validate PRODUCTION (security & performance gate)
    needs: docker
    uses: ./.github/workflows/validation-production.yml
    with:
      image_ref: leodg/moodle-academy:4.5.15-php8.3
    secrets: inherit
