name: Deploy PRODUCTION v2 (build + prepare)

# 1. docker:          builda e publica a imagem v2 (target production)
# 2. validate:        security & performance gate na mesma imagem
# 3. prepare-vps:     na EC2 (prepare.sh + deploy-code.sh):
#                     checkout do codigo em /home/admin/moodle-v2/code, env,
#                     secrets, certs e docker pull. Se o moodle-v2 ja estiver
#                     no ar, o deploy-code.sh atualiza o codigo SE nenhum
#                     version.php mudou (restart so se .php mudou + purge).
#
# A TROCA v1 -> v2 e o upgrade.php NUNCA rodam aqui: sao manuais, etapas C/E de
# .devcontainer/docs/UPGRADE-PHP83-MOODLE-4515-MANUAL.md

env:
  IMAGE_TAG: 4.5.15-php8.3

on:
  push:
    branches:
      - release/production-v2
  workflow_dispatch:

concurrency:
  group: production-v2
  cancel-in-progress: false

jobs:
  docker:
    name: Build and push production image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Lint AMD builds (named define, no ES modules)
        run: python3 .github/scripts/amd_lint.py

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (target production)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/build/moodle.Dockerfile
          target: production
          push: true
          pull: true
          tags: |
            leodg/moodle-academy:${{ env.IMAGE_TAG }}
            leodg/moodle-academy:${{ env.IMAGE_TAG }}-${{ github.sha }}
          build-args: |
            MOODLE_URL=${{ vars.MOODLE_URL }}
            ENVIRONMENT=production

  validate-production:
    name: Validate PRODUCTION (security & performance gate)
    needs: docker
    uses: ./.github/workflows/validation-production.yml
    with:
      image_ref: leodg/moodle-academy:4.5.15-php8.3
    secrets: inherit

  prepare-vps:
    name: Prepare v2 on AWS EC2 (no downtime, no switch)
    needs: [docker, validate-production]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # Scripts ficam fora do diretorio de codigo: o prepare.sh faz checkout
      # em /home/admin/moodle-v2/code e nao pode estar rodando de dentro dele.
      - name: Sync prod-v2 scripts
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # --mkpath: cria /home/admin/devcontainer/bin/ na 1a vez (sem
          # SCRIPT_BEFORE, que deixava local_ssh_script-before-*.sh na VPS)
          ARGS: "-rlzvc --delete --mkpath"
          SOURCE: ".devcontainer/bin/prod-v2/"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: /home/admin/devcontainer/bin/prod-v2/

      - name: Run prepare.sh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e
            chmod +x /home/admin/devcontainer/bin/prod-v2/*.sh
            /home/admin/devcontainer/bin/prod-v2/prepare.sh "${{ github.ref_name }}" "${{ env.IMAGE_TAG }}"
            # Com o moodle-v2 no ar: atualiza o codigo se for seguro (nenhum
            # version.php alterado, checkout sem mudanca local); senao falha
            # e pede a janela manual (guia, etapa E2).
            /home/admin/devcontainer/bin/prod-v2/deploy-code.sh "${{ github.ref_name }}"
