name: Deploy PRODUCTION v2 (compose) to EC2

on:
  push:
    branches:
      - release/production-v2

jobs:
  docker:
    name: Build and push production image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (target production)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/build/moodle.Dockerfile
          target: production
          push: true
          tags: leodg/moodle-academy:4.5.1-v2
          build-args: |
            MOODLE_URL=${{ vars.MOODLE_URL }}
            ENVIRONMENT=production

  deploy:
    name: Deploy to AWS EC2 (PRODUCTION-v2)
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Sync compose files only
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --exclude=secrets/ --exclude=certs/"
          SOURCE: ".devcontainer/"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: /home/admin/devcontainer/
          # TARGET: ${{ vars.REMOTE_TARGET_V2 }}

      - name: Deploy via docker compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            cd /home/admin/devcontainer/

            cp env/prod.env.example env/prod.env

            mkdir -p secrets && mkdir -p certs

            echo "${{ secrets.MOODLE_DBUSER }}" > secrets/db_user
            echo "${{ secrets.MOODLE_DBPASS }}" > secrets/db_password
            echo "${{ secrets.MOODLE_DBROOT }}" > secrets/db_root_password

            sudo cat /etc/letsencrypt/live/ivana.academy/cert.pem > certs/develop-local.crt
            sudo cat /etc/letsencrypt/live/ivana.academy/privkey.pem > certs/develop-local.key

            export IMAGE_TAG=4.5.1-v2
            export MOODLE_URL=${{ vars.MOODLE_URL }}
            export MOODLE_DBTYPE=${{ vars.MOODLE_DBTYPE }}
            export MOODLE_DBHOST=${{ secrets.MOODLE_DBHOST }}
            export MOODLE_DBNAME=${{ secrets.MOODLE_DBNAME }}
            export MOODLE_DBUSER=${{ secrets.MOODLE_DBUSER }}
            export MOODLE_DBPASS=${{ secrets.MOODLE_DBPASS }}
            export MOODLE_DATA=${{ vars.MOODLE_DATA }}
            export PROD_HTTP_PORT=8080
            export PROD_HTTPS_PORT=8443
            export CRON_ENABLED=false

            # ---------------------------------------------------------------
            # Limpeza de containers anteriores do v2 (idempotente)
            # ---------------------------------------------------------------
            echo "🧹 Removendo containers v2 anteriores se existirem..."
            docker compose --env-file env/prod.env -f compose/base.yml -f compose/prod-v2.yml \
              down --remove-orphans 2>/dev/null || true
            docker rm -f moodle-v2 2>/dev/null || true

            # ---------------------------------------------------------------
            # Deploy: sem db.yml (producao usa banco externo, nao container)
            # ---------------------------------------------------------------
            docker compose --env-file env/prod.env -f compose/base.yml -f compose/prod-v2.yml pull
            docker compose --env-file env/prod.env -f compose/base.yml -f compose/prod-v2.yml up -d

            echo "=== Status dos containers ==="
            docker compose --env-file env/prod.env -f compose/base.yml -f compose/prod-v2.yml ps

            echo "=== Verificando saude do container ==="
            sleep 15
            docker inspect moodle-v2 \
              --format='Health: {{.State.Health.Status}}' 2>/dev/null || true
