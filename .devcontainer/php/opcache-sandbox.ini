; Configuracao de OPcache para Moodle - AJUSTADA para VPS 1GB RAM (GCP e2-micro sandbox)
; Baseado no opcache-dev.ini original, mantendo o mecanismo de env var para
; alternar validate_timestamps entre devcontainer local / sandbox / producao.
opcache.enable=1

; CLI (cron do Moodle) nao precisa - script roda uma vez e morre, cachear so gasta RAM a toa.
opcache.enable_cli=0

; 256M era adequado para uma maquina com RAM sobrando; aqui o TOTAL do host e 1GB
; dividido entre PHP+Apache+MariaDB. 96M cobre o codebase do Moodle 4.5 com folga.
opcache.memory_consumption=96

; 16M de strings internadas nao se justifica pra instalacao unica (nao multi-tenant).
; 8M (default) e suficiente e libera RAM pro resto do sistema.
opcache.interned_strings_buffer=8

; Moodle 4.5 tem menos arquivos que o 5.0 (que a doc oficial recomenda 18000).
; 12000 cobre core + alguns plugins extras com folga sem gastar memoria a toa.
; Para conferir o numero real no seu projeto:
;   find . -type f -name "*.php" | wc -l
opcache.max_accelerated_files=12000

; Evita restarts frequentes do cache por fragmentacao de memoria.
opcache.max_wasted_percentage=10

; Requerido pelo Moodle (docs.moodle.org/en/OPcache) - nao mexer.
opcache.use_cwd=1
opcache.save_comments=1
opcache.enable_file_override=0

; Mantido controlavel via env var, como no original:
;   - devcontainer local (codigo mudando o tempo todo): PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
;   - sandbox GCP em fase de validacao de deploy fixo: pode usar 1 tambem (seguranca)
;   - sandbox GCP em teste de PERFORMANCE pura (sem alterar codigo):
;       PHP_OPCACHE_VALIDATE_TIMESTAMPS=0 -> maior ganho, mas exige restart do container
;       apos qualquer mudanca de arquivo para o cache pegar a versao nova
;   - producao (AWS EC2), apos deploy validado: 0
opcache.validate_timestamps=${PHP_OPCACHE_VALIDATE_TIMESTAMPS}

; Com validate_timestamps=1, revalida a cada 5s (ok pro devcontainer).
; Sem efeito quando validate_timestamps=0.
opcache.revalidate_freq=5
