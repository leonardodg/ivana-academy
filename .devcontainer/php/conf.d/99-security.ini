; PHP2Shell - CVE-2026-109618 / CVE-2026-109619 (RCE, CVSS 9.2, 21/10/2026)
; Mitigacao temporaria recomendada enquanto o PHP nao estiver em
; 8.2.35 / 8.3.36 / 8.4.27 / 8.5.12 ou superior. Moodle nao usa o
; progresso de upload de sessao, entao desligar nao tem impacto funcional.
; Mesmo com o PHP corrigido, manter desligado reduz superficie de ataque.
;
; Aplicacao manual no container v1 da VPS: ver README.md nesta pasta.
; =============================================================================
session.upload_progress.enabled = 0
