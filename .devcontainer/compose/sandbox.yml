services:
  moodle:
    container_name: webserver
    image: leodg/moodle-academy:development
    pull_policy: neverif_not_present
    restart: no
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MOODLE_URL=http://localhost
      - ENVIRONMENT=development
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      - MOODLE_DEBUG=MINIMAL
      - MOODLE_DEBUG_DISPLAY=0
      - CRON_ENABLED=false
      - APACHE_LOG_DIR=/var/log/apache2

    networks:
      - moodle_network

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  db:
    image: mariadb:11.4
    container_name: db
    command: >
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_bin
          --innodb_file_per_table=On
          --wait-timeout=28800
          --skip-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: "m@0dl3ing"
      MYSQL_USER: moodle
      MYSQL_PASSWORD: "m@0dl3ing"
      MYSQL_DATABASE: moodle
    networks:
      - moodle_network

    healthcheck:
      test: ["CMD", "mariadb-admin", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  moodle_network:
    driver: bridge