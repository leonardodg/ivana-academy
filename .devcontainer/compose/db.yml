services:
  # =========================================================================
  #                    SERVICE: db (MySQL/MariaDB)
  # =========================================================================
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command: >
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_bin
          --innodb_file_per_table=On
          --wait-timeout=28800
          --skip-log-bin
    env_file:
      - ../env/db.env
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_USER_FILE:          /run/secrets/db_user
      MARIADB_PASSWORD_FILE:      /run/secrets/db_password
      MARIADB_DATABASE:      ${MOODLE_DBNAME:-moodle}
      MARIADB_ROOT_HOST:     "%"  # opcional: allow connection from any host
    volumes:
      - dbdata:/var/lib/mysql
      - ../config/mysql-dev.cnf:/etc/mysql/conf.d/custom.cnf:ro
    ports:
      - "3306:3306/tcp"
    networks:
      - moodle_network

    deploy:
      resources:
        limits:
          memory: 350M
        reservations:
          memory: 128M

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    secrets:
      - db_root_password
      - db_user
      - db_password

