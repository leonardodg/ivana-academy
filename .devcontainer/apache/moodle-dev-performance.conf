# Ajuste agressivo de MPM para evitar estouro de memória (OOM)
<IfModule mpm_prefork_module>
    StartServers          2
    MinSpareServers        1
    MaxSpareServers        3
    MaxRequestWorkers      6
    MaxConnectionsPerChild 500
</IfModule>

# Habilitar compressão para economizar largura de banda e rede
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json
</IfModule>